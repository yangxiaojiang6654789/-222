# 阿里云函数计算 FC 部署配置（Serverless Devs, fc3）
# 安装 Serverless Devs 后，在本目录执行：s deploy
edition: 3.0.0
name: all-day-recorder-summary
access: "default"

resources:
  summary_func:
    component: fc3
    props:
      region: cn-hangzhou
      functionName: recorder-summary
      description: 全天录音云端转写总结
      runtime: python3.10
      handler: handler.handler
      timeout: 300
      memorySize: 512
      code: ./
      environmentVariables:
        CONFIG_PATH: /code/config.yaml
      triggers:
        - triggerName: daily-22
          triggerType: timer
          triggerConfig:
            # 每天 22:00 触发（阿里云 cron 为「秒 分 时 日 月 星期 年」7 段）
            cronExpression: "0 0 22 * * * *"
            enable: true
            payload: ""
