<style>
  :root{
    --bg:#1a1d24; --watch-bg:#f5f6f8; --card:#fff; --text:#1f2329;
    --muted:#8a919c; --accent:#2f6fed; --border:#e5e8ec; --red:#e5484d;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:20px;padding:28px 12px;}
  h1{color:#fff;font-size:18px;font-weight:600;}
  .sub{color:#8b93a1;font-size:13px;text-align:center;max-width:520px;line-height:1.6;}

  /* 手表外壳 */
  .watch{
    width:340px;height:340px;border-radius:44px;background:#0e0f13;
    padding:16px;box-shadow:0 18px 50px rgba(0,0,0,.5);
  }
  .screen{
    width:100%;height:100%;border-radius:30px;background:var(--watch-bg);
    overflow:hidden;position:relative;display:flex;flex-direction:column;
    border:1px solid #2a2d35;
  }
  .screen-head{
    padding:10px 12px 6px;text-align:center;font-size:14px;font-weight:700;
    border-bottom:1px solid var(--border);background:var(--card);
  }

  /* 主界面 */
  .status{
    padding:10px 12px;font-size:12.5px;line-height:1.55;text-align:center;
    background:var(--card);border-bottom:1px solid var(--border);
    white-space:pre-line;
  }
  .status .rec{color:var(--red);}
  .btns{padding:8px 10px;display:flex;flex-direction:column;gap:6px;flex:1;overflow-y:auto;}
  .btn{
    width:100%;padding:10px;border:none;border-radius:10px;font-size:15px;
    cursor:pointer;background:#fff;border:1px solid var(--border);color:var(--text);
  }
  .btn:active{transform:scale(.97);}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-size:16px;font-weight:600;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  /* 设置页 */
  .form{padding:10px 12px;flex:1;overflow-y:auto;background:var(--card);}
  .form h4{font-size:13px;margin:8px 0 4px;}
  .form h4.first{margin-top:0;}
  .lbl{font-size:11px;color:var(--muted);margin-top:6px;}
  .inp{width:100%;padding:7px 8px;border:1px solid var(--border);border-radius:8px;font-size:12.5px;margin-top:2px;}
  .check{display:flex;align-items:center;gap:6px;font-size:12.5px;margin-top:6px;}
  .check input{width:auto;}
  .radios{display:flex;flex-direction:column;gap:2px;font-size:12.5px;margin-top:2px;}
  .radios label{display:flex;align-items:center;gap:6px;}
  .radios input{width:auto;}

  /* 文件页 */
  .files{padding:8px 10px;flex:1;overflow-y:auto;background:var(--card);}
  .file-row{display:flex;align-items:center;justify-content:space-between;padding:8px 6px;border-bottom:1px solid var(--border);}
  .file-meta{font-size:11.5px;line-height:1.4;}
  .file-meta .nm{font-size:12.5px;font-weight:600;color:var(--text);}
  .file-meta .sz{color:var(--muted);font-size:11px;}
  .mini{font-size:11px;padding:5px 10px;border-radius:8px;border:1px solid var(--border);background:#fff;cursor:pointer;}
  .mini.del{color:var(--red);border-color:#f0c0c2;}

  .toolbar{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--border);background:var(--card);}
  .toolbar .spacer{flex:1;}
  .toolbar .sum{font-size:12px;color:var(--muted);}

  .hint-line{color:#8b93a1;font-size:12px;text-align:center;}
</style>
</head>

<script>
  // 状态
  let recording = false, paused = false, seconds = 0, timer = null;

  const $ = id => document.getElementById(id);
  const files = [
    {nm:"20260915_142030_112.m4a", sz:"0.5 MB"},
    {nm:"20260915_132015_004.m4a", sz:"0.5 MB"},
    {nm:"20260915_121958_882.m4a", sz:"0.5 MB"},
    {nm:"20260915_111740_331.m4a", sz:"0.5 MB"},
    {nm:"20260915_101530_668.m4a", sz:"0.4 MB"},
  ];

  function fmt(s){
    const h=String(Math.floor(s/3600)).padStart(2,'0');
    const m=String(Math.floor(s%3600/60)).padStart(2,'0');
    const ss=String(s%60).padStart(2,'0');
    return h+':'+m+':'+ss;
  }

  function renderStatus(){
    let line;
    if(recording && paused) line = '❚❚ 已暂停 · '+fmt(seconds);
    else if(recording) line = '● 正在录音 · '+fmt(seconds);
    else line = '○ 已停止 · '+fmt(seconds);
    line += '\n今日 3 段 · 待上传 '+(recording?files.length+1:files.length)+' 段';
    line += '\n占用 2.4 MB';
    $('status').innerHTML = line;
    $('status').querySelector('') // noop
    $('btnToggle').textContent = (recording&&paused)?'继续录音':(recording?'暂停':'开始录音');
    $('btnStop').disabled = !recording;
  }

  function startTimer(){
    stopTimer();
    timer = setInterval(()=>{ if(recording && !paused){ seconds++; renderStatus(); } }, 1000);
  }
  function stopTimer(){ if(timer){ clearInterval(timer); timer=null; } }

  $('btnToggle').addEventListener('click', ()=>{
    if(!recording){ recording=true; paused=false; seconds=0; startTimer(); }
    else if(paused){ paused=false; }
    else { paused=true; }
    renderStatus();
  });
  $('btnStop').addEventListener('click', ()=>{
    recording=false; paused=false; stopTimer(); renderStatus();
  });
  $('btnUpload').addEventListener('click', ()=>{
    $('status').innerHTML = '● 正在上传… 3/5\n20260915_142030_112.m4a\n完成后自动删除本地';
  });
  $('btnSettings').addEventListener('click', ()=>show('settings'));
  $('btnFiles').addEventListener('click', ()=>{ renderFiles(); show('files'); });

  function renderFiles(){
    $('fileList').innerHTML = '';
    files.forEach(f=>{
      const row = document.createElement('div');
      row.className='file-row';
      row.innerHTML = '<div class="file-meta"><div class="nm">'+f.nm+'</div><div class="sz">'+f.sz+' · 09-15 14:20</div></div>'+
        '<button class="mini del">删除</button>';
      row.querySelector('.mini').addEventListener('click',()=>{
        files.splice(files.indexOf(f),1);
        $('fileSum').textContent = '共 '+files.length+' 段 · 2.0 MB';
        renderFiles();
      });
      $('fileList').appendChild(row);
    });
  }
  $('btnClearAll').addEventListener('click', ()=>{
    files.length=0; $('fileSum').textContent='共 0 段 · 0 MB'; renderFiles();
  });

  function show(name){
    ['home','settings','files'].forEach(n=>{
      $('view-'+n).style.display = (n===name)?'flex':'none';
    });
  }

  renderStatus();
</script>
