services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      # PikPak WebDAV 连接信息
      WEBDAV_URL: "https://dav.mypikpak.com"
      WEBDAV_USER: "你的WebDAV用户名"
      WEBDAV_PASS: "你的WebDAV密码"
      WEBDAV_FOLDER: "watch-recordings"
      # 网页访问密码（必填，改成你自己的）
      WEB_PASSWORD: "change-me"
      # 会话密钥（随便填一串随机字符串）
      SECRET_KEY: "please-change-to-a-random-string"
    restart: always
